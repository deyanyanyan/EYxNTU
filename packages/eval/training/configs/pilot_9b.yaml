# First GPU milestone: prompted baseline, resumable LoRA pilot and adapter evaluation
# for Qwen3.5-9B on the text-only public tasks. Changing anything under seed/model/
# data/lora/train changes the training hash: give the run a new run_id instead.
run_id: pilot-9b-v1
seed: 42

model:
  id: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a  # main on 2026-10-27; staged by pbs/setup_env.sh
  template: qwen3_5

data:
  version: v1  # $EVALTRAIN_ROOT/prepared/v1
  max_length: 4096  # profiled: no text example exceeds 3,055 tokens under this template
  mixture:
    # Bounded, task-balanced pilot subset. RAGTruth carries human labels; Prometheus
    # labels are GPT-4's, so it is limited to a share rather than its full 95k rows.
    ragtruth_grounding: {n: 3000}
    prometheus_rubric: {n: 3000, per_group_cap: 4}  # >= 750 distinct rubrics

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear  # language model only; vision tower and aligner frozen

train:
  epochs: 1
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 1  # raise only after the first job's memory profile (new run_id)
  grad_accum: 16  # 6,000 rows -> 375 optimizer steps
  attn_impl: sdpa
  packing: false  # needs flash-linear-attention + flash_attn; enable after profiling
  logging_steps: 5
  save_total_limit: 3

walltime:
  # Not part of the training hash: adjustable between jobs. Sized for 1-hour jobs in
  # gpu_free_high; a 9B rank-16 LoRA checkpoint (adapter + optimizer) saves in seconds.
  # Re-check against save_seconds in CHECKPOINT_COMPLETE.json after the first save.
  reserve_minutes: 6
  save_every_minutes: 10

eval:
  tasks: [prometheus_rubric, ragtruth_grounding, oak_distractors]
  limit_per_task: 600  # spread across all groups; Oak dev has 185 rows
  max_model_len: 8192
  # Requests handed to vLLM at once. Only 8 of the 32 layers keep a KV cache (the
  # Gated DeltaNet layers hold a fixed-size state), so 256 concurrent requests fit.
  batch_size: 256
