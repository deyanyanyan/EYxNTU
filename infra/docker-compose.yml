# Base stack. Select hardware with COMPOSE_PROFILES=cpu|gpu in .env
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
# (or from repo root: `make up`)
name: lms-platform

x-py-env: &py-env
  env_file: ../.env
  environment:
    DATA_DIR: /data
    PROMPTS_DIR: /srv/packages/prompts

services:
  postgres:
    # Tested pg16 image; update the digest deliberately with a migration/startup check.
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: api
    <<: *py-env
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: worker
    <<: *py-env
    restart: unless-stopped
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12

  tts:
    profiles: ["media"]
    build:
      context: ..
      dockerfile: services/tts/Dockerfile
    env_file: ../.env
    environment:
      TTS_MODEL_DIR: /models
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ../data/models/tts:/models

  # ---- cpu profile: Ollama ---------------------------------------------------
  ollama:
    # Tested Ollama 0.34.0 image.
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    profiles: ["cpu"]
    restart: unless-stopped
    environment:
      # Ollama defaults to 4096 and truncates longer prompts without an error,
      # which silently deletes retrieved evidence. Keep in step with
      # LLM_CONTEXT_TOKENS; raising it costs RAM (~5.1 GB at 4k, ~5.9 GB at 16k).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ../data/models/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- gpu profile: vLLM on the H100 -----------------------------------------
  # One base model plus the custom LoRA adapters listed in VLLM_LORA_MODULES; each
  # adapter is selected per request by its name (see services/inference/README.md).
  inference:
    # vLLM 0.32.0: the version the reviewer adapter is evaluated with on GaaS. LoRA support
    # for the hybrid Qwen3.5/3.8 architecture has changed between releases, so move this
    # digest only together with a passing `make served-check`.
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    profiles: ["gpu"]
    restart: unless-stopped
    ipc: host
    entrypoint: ["/bin/bash", "/opt/lms/serve.sh"]
    # Only the serving settings: the full .env also holds database and admin secrets.
    environment:
      HF_HOME: /data/models/hf
      HF_HUB_OFFLINE: "1"
      SERVE_MODEL: ${VLLM_MODEL}
      SERVE_BASE_ID: ${VLLM_BASE_ID:-}
      SERVE_REVISION: ${VLLM_REVISION:-}
      SERVE_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-32768}
      SERVE_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      SERVE_LORA_MODULES: ${VLLM_LORA_MODULES:-}
      SERVE_MAX_LORAS: ${VLLM_MAX_LORAS:-2}
      SERVE_MAX_LORA_RANK: ${VLLM_MAX_LORA_RANK:-16}
      SERVE_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ../data:/data
      - ./inference/serve.sh:/opt/lms/serve.sh:ro
    healthcheck:
      # Loading and compiling a 9-27B model takes minutes: `up --wait` waits for this.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 900s
      retries: 8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
