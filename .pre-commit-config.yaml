repos:
  - repo: local
    hooks:
      - id: scrub-check
        name: scrub-check (denylisted identifiers)
        entry: bash scripts/scrub-check.sh
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
